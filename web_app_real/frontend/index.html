<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .logout-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            margin-bottom: 30px;
        }

        .logout-btn:hover {
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.3);
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            text-align: center;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 1px solid #e9ecef;
        }

        .section h2 {
            color: #495057;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .userdata-display {
            background: white;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            color: #495057;
        }

        .hidden {
            display: none;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .user-info {
            background: linear-gradient(135deg, #e8f5e8 0%, #d4edda 100%);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            color: #155724;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Web Application</h1>

        <div id="messageContainer"></div>

        <!-- Login Form -->
        <div id="loginSection">
            <div class="section">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username:</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit">Login</button>
                </form>
            </div>
        </div>

        <!-- Logged In Section -->
        <div id="loggedInSection" class="hidden">
            <div class="user-info">
                <span id="userInfo">Welcome!</span>
            </div>

            <button id="logoutBtn" class="logout-btn">Logout</button>

            <!-- Post Data Section -->
            <div class="section">
                <h2>Post User Data</h2>
                <form id="postDataForm">
                    <div class="form-group">
                        <label for="userdata">User Data:</label>
                        <textarea id="userdata" name="userdata" placeholder="Enter your data here..."
                            required></textarea>
                    </div>
                    <button type="submit">Post Data</button>
                </form>
            </div>

            <!-- Get Data Section -->
            <div class="section">
                <h2>Retrieve User Data</h2>
                <button id="getUserDataBtn">Get User Data</button>
                <div id="userdataDisplay" class="userdata-display hidden"></div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let isLoggedIn = false;
        let currentUserId = null;

        // DOM elements
        const loginSection = document.getElementById('loginSection');
        const loggedInSection = document.getElementById('loggedInSection');
        const messageContainer = document.getElementById('messageContainer');
        const loginForm = document.getElementById('loginForm');
        const postDataForm = document.getElementById('postDataForm');
        const logoutBtn = document.getElementById('logoutBtn');
        const getUserDataBtn = document.getElementById('getUserDataBtn');
        const userdataDisplay = document.getElementById('userdataDisplay');
        const userInfo = document.getElementById('userInfo');

        // Utility functions
        function showMessage(message, type = 'success') {
            messageContainer.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                messageContainer.innerHTML = '';
            }, 5000);
        }

        function setLoading(element, isLoading) {
            if (isLoading) {
                element.classList.add('loading');
            } else {
                element.classList.remove('loading');
            }
        }

        function showLoginSection() {
            loginSection.classList.remove('hidden');
            loggedInSection.classList.add('hidden');
            isLoggedIn = false;
            currentUserId = null;
        }

        function showLoggedInSection(userId) {
            loginSection.classList.add('hidden');
            loggedInSection.classList.remove('hidden');
            isLoggedIn = true;
            currentUserId = userId;
            userInfo.textContent = `Welcome! User ID: ${userId}`;
            userdataDisplay.classList.add('hidden');
        }

        // API functions
        async function makeRequest(url, options = {}) {
            try {
                const response = await fetch(url, {
                    credentials: 'include', // Include cookies
                    ...options
                });

                const data = await response.json();
                return { response, data };
            } catch (error) {
                throw new Error('Network error: ' + error.message);
            }
        }

        // Login handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(loginForm);
            const username = formData.get('username');
            const password = formData.get('password');

            setLoading(loginForm, true);

            try {
                const { response, data } = await makeRequest('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.status === 200) {
                    showMessage('Login successful!', 'success');
                    showLoggedInSection(data.userId);
                    loginForm.reset();
                } else if (response.status === 400) {
                    showMessage('Invalid request format', 'error');
                } else if (response.status === 401) {
                    showMessage('Invalid username or password', 'error');
                } else if (response.status === 403) {
                    showMessage('User already logged in', 'error');
                } else {
                    showMessage('Login failed', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            } finally {
                setLoading(loginForm, false);
            }
        });

        // Logout handler
        logoutBtn.addEventListener('click', async () => {
            setLoading(logoutBtn, true);

            try {
                const { response, data } = await makeRequest('/logout', {
                    method: 'GET'
                });

                if (response.status === 200) {
                    showMessage('Logout successful!', 'success');
                    showLoginSection();
                } else if (response.status === 403) {
                    showMessage('Not logged in', 'error');
                    showLoginSection();
                } else {
                    showMessage('Logout failed', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            } finally {
                setLoading(logoutBtn, false);
            }
        });

        // Post data handler
        postDataForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(postDataForm);
            const userdata = formData.get('userdata');

            setLoading(postDataForm, true);

            try {
                const { response, data } = await makeRequest('/postdata', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ userdata })
                });

                if (response.status === 200) {
                    showMessage('Data posted successfully!', 'success');
                    postDataForm.reset();
                } else if (response.status === 400) {
                    showMessage('Invalid request format', 'error');
                } else if (response.status === 403) {
                    showMessage('Not logged in', 'error');
                    showLoginSection();
                } else {
                    showMessage('Failed to post data', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            } finally {
                setLoading(postDataForm, false);
            }
        });

        // Get user data handler
        getUserDataBtn.addEventListener('click', async () => {
            setLoading(getUserDataBtn, true);

            try {
                const { response, data } = await makeRequest('/userdata', {
                    method: 'GET'
                });

                if (response.status === 200) {
                    showMessage('Data retrieved successfully!', 'success');
                    userdataDisplay.textContent = data.userdata || 'No data available';
                    userdataDisplay.classList.remove('hidden');
                } else if (response.status === 403) {
                    showMessage('Not logged in', 'error');
                    showLoginSection();
                } else {
                    showMessage('Failed to retrieve data', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            } finally {
                setLoading(getUserDataBtn, false);
            }
        });

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            showLoginSection();
        });
    </script>
</body>

</html>
