<!DOCTYPE html>
<!-- from DeepSeek -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web App</title>
    <style>
        /* Base Styles */
        :root {
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --text-color: #333;
            --light-gray: #f5f5f5;
            --border-radius: 4px;
            --box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--light-gray);
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }

        h1,
        h2,
        h3 {
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        /* Header Styles */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 30px;
        }

        /* Navigation Styles */
        nav {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .btn {
            display: inline-block;
            background: var(--primary-color);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: var(--border-radius);
            cursor: pointer;
            text-decoration: none;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: var(--secondary-color);
        }

        .btn-logout {
            background: var(--error-color);
        }

        .btn-logout:hover {
            background: #c0392b;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            font-size: 1rem;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* Message Styles */
        .message {
            padding: 15px;
            margin: 20px 0;
            border-radius: var(--border-radius);
        }

        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* Data Display */
        .user-data {
            background: var(--light-gray);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-top: 20px;
            white-space: pre-wrap;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            nav {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Simple Web App</h1>
            <div id="userInfo"></div>
        </header>

        <main id="mainContent">
            <!-- Content will be dynamically loaded here -->
        </main>

        <div id="messageArea"></div>
    </div>

    <script>
        // DOM Elements
        const mainContent = document.getElementById('mainContent');
        const userInfo = document.getElementById('userInfo');
        const messageArea = document.getElementById('messageArea');

        // Application State
        let currentUser = null;

        // Initialize application
        document.addEventListener('DOMContentLoaded', async () => {
            await checkSession();
            renderContent();
        });

        // Check if user is logged in
        async function checkSession() {
            try {
                const response = await fetch('/userdata', {
                    method: 'GET',
                    credentials: 'include' // Include cookies
                });

                if (response.ok) {
                    const data = await response.json();
                    // Extract username from message
                    const username = data.message.match(/got userdata of (.+)$/)?.[1];
                    if (username) {
                        currentUser = username;
                    }
                }
            } catch (error) {
                console.error('Session check failed:', error);
            }
        }

        // Render appropriate content based on auth state
        function renderContent() {
            if (currentUser) {
                renderAuthenticatedView();
            } else {
                renderUnauthenticatedView();
            }
        }

        // Render view for logged-in users
        function renderAuthenticatedView() {
            userInfo.innerHTML = `<p>Welcome, <strong>${currentUser}</strong>!</p>`;

            mainContent.innerHTML = `
                <section>
                    <h2>Dashboard</h2>
                    <nav>
                        <button class="btn" onclick="loadUserData()">Get User Data</button>
                        <button class="btn" onclick="showPostDataForm()">Post Data</button>
                        <button class="btn btn-logout" onclick="logout()">Logout</button>
                    </nav>
                </section>
                <section id="contentSection">
                    <!-- Dynamic content will load here -->
                </section>
            `;
        }

        // Render view for guests
        function renderUnauthenticatedView() {
            userInfo.innerHTML = '';
            mainContent.innerHTML = `
                <section>
                    <h2>Welcome, Guest</h2>
                    <p>Please log in or register to continue.</p>
                    <nav>
                        <button class="btn" onclick="showLoginForm()">Login</button>
                        <button class="btn" onclick="showRegisterForm()">Register</button>
                    </nav>
                </section>
                <section id="contentSection">
                    <!-- Forms will load here -->
                </section>
            `;
        }

        // Show login form
        function showLoginForm() {
            document.getElementById('contentSection').innerHTML = `
                <div class="form-container">
                    <h3>Login</h3>
                    <form id="loginForm" onsubmit="login(event)">
                        <div class="form-group">
                            <label for="username">Username</label>
                            <input type="text" id="username" required>
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" required>
                        </div>
                        <button type="submit" class="btn">Login</button>
                    </form>
                </div>
            `;
        }

        // Show registration form
        function showRegisterForm() {
            document.getElementById('contentSection').innerHTML = `
                <div class="form-container">
                    <h3>Register</h3>
                    <form id="registerForm" onsubmit="register(event)">
                        <div class="form-group">
                            <label for="regUsername">Username</label>
                            <input type="text" id="regUsername" required>
                        </div>
                        <div class="form-group">
                            <label for="regPassword">Password</label>
                            <input type="password" id="regPassword" required>
                        </div>
                        <button type="submit" class="btn">Register</button>
                    </form>
                </div>
            `;
        }

        // Show post data form
        function showPostDataForm() {
            document.getElementById('contentSection').innerHTML = `
                <div class="form-container">
                    <h3>Post Data</h3>
                    <form id="postDataForm" onsubmit="postData(event)">
                        <div class="form-group">
                            <label for="userdata">Your Data</label>
                            <textarea id="userdata" required></textarea>
                        </div>
                        <button type="submit" class="btn">Submit</button>
                    </form>
                </div>
            `;
        }

        // Handle login
        async function login(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });

                if (response.ok) {
                    currentUser = username;
                    showMessage('Login successful!', 'success');
                    renderContent();
                } else {
                    handleErrorResponse(response, 'Login failed');
                }
            } catch (error) {
                showMessage('Network error: ' + error.message, 'error');
            }
        }

        // Handle registration
        async function register(event) {
            event.preventDefault();

            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });

                if (response.ok) {
                    showMessage('Registration successful! Please log in.', 'success');
                    showLoginForm();
                } else {
                    handleErrorResponse(response, 'Registration failed');
                }
            } catch (error) {
                showMessage('Network error: ' + error.message, 'error');
            }
        }

        // Handle logout
        async function logout() {
            try {
                const response = await fetch('/logout', {
                    method: 'GET',
                    credentials: 'include'
                });

                if (response.ok) {
                    currentUser = null;
                    showMessage('Logout successful', 'success');
                    renderContent();
                } else {
                    handleErrorResponse(response, 'Logout failed');
                }
            } catch (error) {
                showMessage('Network error: ' + error.message, 'error');
            }
        }

        // Load user data
        async function loadUserData() {
            try {
                const response = await fetch('/userdata', {
                    method: 'GET',
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('contentSection').innerHTML = `
                        <div class="user-data-container">
                            <h3>Your Data</h3>
                            <div class="user-data">${data.userdata || 'No data available'}</div>
                        </div>
                    `;
                } else {
                    handleErrorResponse(response, 'Failed to load user data');
                }
            } catch (error) {
                showMessage('Network error: ' + error.message, 'error');
            }
        }

        // Post user data
        async function postData(event) {
            event.preventDefault();

            const userdata = document.getElementById('userdata').value;

            try {
                const response = await fetch('/postdata', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userdata }),
                    credentials: 'include'
                });

                if (response.ok) {
                    showMessage('Data posted successfully!', 'success');
                    document.getElementById('userdata').value = '';
                } else {
                    handleErrorResponse(response, 'Failed to post data');
                }
            } catch (error) {
                showMessage('Network error: ' + error.message, 'error');
            }
        }

        // Handle error responses
        async function handleErrorResponse(response, defaultMessage) {
            if (response.status === 400) {
                showMessage('Bad request: Invalid input format', 'error');
            } else if (response.status === 401) {
                showMessage('Unauthorized: Invalid credentials', 'error');
            } else if (response.status === 403) {
                try {
                    const data = await response.json();
                    showMessage(`Forbidden: ${data.message || 'Operation not allowed'}`, 'error');
                } catch {
                    showMessage('Forbidden: Operation not allowed', 'error');
                }
            } else {
                showMessage(`${defaultMessage}: Status ${response.status}`, 'error');
            }
        }

        // Show message to user
        function showMessage(message, type = 'info') {
            messageArea.innerHTML = `
                <div class="message ${type}">
                    ${message}
                </div>
            `;

            // Auto-hide success messages after 5 seconds
            if (type === 'success') {
                setTimeout(() => {
                    messageArea.innerHTML = '';
                }, 5000);
            }
        }
    </script>
</body>

</html>
